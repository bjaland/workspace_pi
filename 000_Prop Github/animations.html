<title>twelve. Animaciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
:root {
  --p: #EF0080;
  --bg: #1a1a1a;
  --font: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
.page {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-block: 2rem 3rem;
  padding-inline: 1rem;
  gap: 1.5rem;
}
.brand {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.06em;
  color: var(--p);
}
.brand-dot {
  display: inline-block;
  width: 7px; height: 7px;
  background: var(--p);
  border-radius: 50%;
  vertical-align: top;
  margin-top: 5px;
  margin-left: 1px;
}
.sub {
  font-size: 0.8rem;
  color: #888;
  margin-top: 2px;
  text-align: center;
}
.cards {
  display: flex;
  gap: 1.25rem;
  width: 100%;
  max-width: 860px;
  justify-content: center;
  flex-wrap: wrap;
}
.card {
  flex: 1 1 340px;
  max-width: 420px;
  background: #111;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.card-img-wrap {
  position: relative;
  width: 100%;
  display: block;
  line-height: 0;
}
.card-img-wrap img {
  width: 100%;
  display: block;
}
/* SVG overlay fills the whole image */
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.card-label {
  padding: 12px 16px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #888;
  letter-spacing: .03em;
  text-transform: uppercase;
}

/* ── TURBINE BLADES ─────────────────────────────────── */
/* Hub center in image 1 is at ~63.5% from left, ~40% from top
   The SVG viewBox matches 100×133.3 (3:4 portrait) for easy % maths */
#blade-group {
  transform-origin: 63.5px 40px;
  animation: spin-blades 2.8s linear infinite;
}
@keyframes spin-blades {
  to { transform: rotate(360deg); }
}

/* ── WATER DROPS ─────────────────────────────────────── */
/* Drop 1 family: top-left, falls from y≈8% to y≈27% at x≈16% */
.drop-tl { animation: fall-tl 1.4s cubic-bezier(.4,0,.6,1) infinite; }
.drop-tl.d2 { animation-delay: -0.5s; }
.drop-tl.d3 { animation-delay: -1.0s; }
@keyframes fall-tl {
  0%   { transform: translateY(0);   opacity: 0; }
  10%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateY(22px); opacity: 0; }
}

/* Drop 2 family: right side, falls from pipe end ~x=78%, y=47% down */
.drop-r { animation: fall-r 1.6s cubic-bezier(.4,0,.6,1) infinite; }
.drop-r.d2 { animation-delay: -0.6s; }
.drop-r.d3 { animation-delay: -1.2s; }
@keyframes fall-r {
  0%   { transform: translateY(0);   opacity: 0; }
  8%   { opacity: 1; }
  75%  { opacity: 1; }
  100% { transform: translateY(18px); opacity: 0; }
}

/* Second tier drop: from upper bowl to lower bowl */
.drop-r2 { animation: fall-r2 1.8s cubic-bezier(.4,0,.6,1) infinite; animation-delay: -0.9s; }
.drop-r2.d2 { animation-delay: -1.6s; }
@keyframes fall-r2 {
  0%   { transform: translateY(0);   opacity: 0; }
  10%  { opacity: 0.9; }
  80%  { opacity: 0.9; }
  100% { transform: translateY(16px); opacity: 0; }
}

/* Ripple on bowls */
.ripple {
  transform-origin: center;
  animation: ripple-anim 1.6s ease-out infinite;
  opacity: 0;
}
.ripple.r2 { animation-delay: -0.8s; }
@keyframes ripple-anim {
  0%   { transform: scale(0.2); opacity: 0.7; }
  100% { transform: scale(1.8); opacity: 0; }
}
</style>
